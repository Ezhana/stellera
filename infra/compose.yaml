services:
  redis:
    image: ${REDIS_IMAGE:-redis:latest}
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-UTC}
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis}
      --save ${REDIS_SAVE:-""}
      --appendonly ${REDIS_APPENDONLY:-no}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}

include:
  - ./postgres/compose.yaml
  - ./new-api/compose.yaml
