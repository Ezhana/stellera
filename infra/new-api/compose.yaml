services:
  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:latest}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file: ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: "true"    # 是否启用错误日志记录
      BATCH_UPDATE_ENABLED: "true" # 是否启用批量更新
      # 更多可选配置见 https://docs.newapi.pro/installation/environment-variables/
    depends_on:
      postgres:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
