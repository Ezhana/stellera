global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # LiteLLM 网关：/metrics 需要 API key 鉴权（Bearer），
  # token 由 compose secret 注入，值来自 prometheus/.env 的 LITELLM_METRICS_TOKEN
  # （与 infra/litellm/.env 的主密钥保持一致）。
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm_metrics_token
    static_configs:
      - targets: ["litellm:4000"]
