services:
  redis:
    image: ${REDIS_IMAGE:-redis:latest}
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?未设置 REDIS_PASSWORD，见 infra/redis/.env.example}
      --save ${REDIS_SAVE:-""}
      --appendonly ${REDIS_APPENDONLY:-no}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
