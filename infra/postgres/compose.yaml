services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stellera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stellera}
      POSTGRES_DB: ${POSTGRES_DB:-stellera}
      POSTGRES_DBS: ${POSTGRES_DBS:-}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
