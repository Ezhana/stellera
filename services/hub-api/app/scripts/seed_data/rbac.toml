# RBAC 基线数据：每次 init / seed 都会应用（幂等）。
# 角色树：authenticated（根）-> member -> realname / enterprise / engineer / admin。
# realname 只是认证身份，不额外授予业务权限；roles 的 parent 可省略，表示根角色。

[[roles]]
name = "authenticated"
description = "所有已登录用户的基线角色"

[[roles]]
name = "member"
parent = "authenticated"
description = "注册即获得的会员基线角色"

[[roles]]
name = "realname"
parent = "member"
description = "已实名认证：仅作身份标识，不额外授予业务权限"

[[roles]]
name = "enterprise"
parent = "member"
description = "已认证企业：发布需求 / 审批接单与交付申请 / 取消订单"

[[roles]]
name = "engineer"
parent = "member"
description = "已认证工程师：申请接单 / 提交工作日志 / 申请交付"

[[roles]]
name = "admin"
parent = "member"
description = "超级管理员：管理后台全部权限"

# 业务端点对所有登录用户开放（authenticated），具体权限（发布者 / 接单工程师 /
# 申请人 / 管理员）由服务层按归属判断；admin 另外保留 /api/v1/* 全方法通配。

[[permissions]]
role = "authenticated"
object = "/api/v1/auth/me"
action = "^GET$"
description = "读取当前用户"

[[permissions]]
role = "authenticated"
object = "/api/v1/auth/logout"
action = "^POST$"
description = "登出并吊销 refresh token"

[[permissions]]
role = "authenticated"
object = "/api/v1/wallet"
action = "^GET$"
description = "只读：我的钱包"

[[permissions]]
role = "authenticated"
object = "/api/v1/wallet/transactions"
action = "^GET$"
description = "只读：钱包流水"

[[permissions]]
role = "authenticated"
object = "/api/v1/wallet/redeem"
action = "^POST$"
description = "兑换码入账"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders"
action = "^GET$"
description = "只读：FDE 订单大厅"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders/*"
action = "^GET$"
description = "只读：FDE 订单详情 / 我发布的 / 我接到的"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders"
action = "^POST$"
description = "发布 FDE 需求"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders/*/cancel"
action = "^POST$"
description = "取消订单（服务层限定发布者 / 管理员）"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders/*/logs"
action = "^POST$"
description = "提交工作日志（服务层限定接单工程师 / 管理员）"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/orders/*/applications"
action = "^POST$"
description = "申请接单 / 申请交付"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/applications/mine"
action = "^GET$"
description = "只读：我发起的申请"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/applications/received"
action = "^GET$"
description = "只读：我发布的订单收到的申请"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/applications/*/approve"
action = "^POST$"
description = "通过申请（服务层限定订单发布者 / 管理员）"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/applications/*/reject"
action = "^POST$"
description = "驳回申请（服务层限定订单发布者 / 管理员）"

[[permissions]]
role = "authenticated"
object = "/api/v1/fde/applications/*/withdraw"
action = "^POST$"
description = "撤回申请（服务层限定申请人本人）"

[[permissions]]
role = "authenticated"
object = "/api/v1/profile"
action = "^GET$"
description = "读取本人资料与合作记录"

[[permissions]]
role = "authenticated"
object = "/api/v1/profile"
action = "^PATCH$"
description = "修改本人资料"

[[permissions]]
role = "authenticated"
object = "/api/v1/profile/certification-applications"
action = "^GET$"
description = "只读：我的认证申请"

[[permissions]]
role = "authenticated"
object = "/api/v1/profile/certification-applications"
action = "^POST$"
description = "提交实名 / 企业 / 工程师认证申请"

[[permissions]]
role = "authenticated"
object = "/api/v1/profiles/*"
action = "^GET$"
description = "只读：他人公开主页"

[[permissions]]
role = "admin"
object = "/api/v1/*"
action = "^(GET|POST|PUT|PATCH|DELETE)$"
description = "管理后台全部业务 API 权限"
