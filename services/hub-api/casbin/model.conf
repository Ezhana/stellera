; Casbin 模型：RBAC + 路径/方法匹配。
;
; - sub 带前缀 `user:<id>` / `role:<name>`，匿名主体固定为 `anonymous`，
;   避免用户名/角色名重名时被 Casbin 当成同一个主体；
; - obj 用 keyMatch2 支持 `/api/v1/*` 与 `:param`；
; - act 用 regexMatch 支持 `(GET|POST)` 这类方法组合；
; - 角色继承与用户-角色关系由 app/rbac/enforcer.py 从 PostgreSQL 投影成 g。
; policy 本文件不落盘，全部来自数据库 + app/rbac/policies.py 的公开策略。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
