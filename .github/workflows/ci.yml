# CI：按项目各自的原生工具链跑 lint / test / build / typecheck。
#
# 没有根 package.json，也不需要根级任务调度器：
#   - 后端 services/hub-api 用 uv（版本跟随服务内 .python-version 与 uv.lock）；
#   - 前端 clients/web 用 pnpm workspace（Node 版本来自 package.json 的 engines，
#     pnpm 版本来自 packageManager 字段，由 corepack 自动取用）。
# 两个 job 并行执行；加新项目就是加一个 job，不需要任何根级调度器。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，避免过期的 CI 结果占用 runner 和排队时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hub-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 与 uv 跟随后端自己的 .python-version（3.13）与 uv.lock。
      # setup-uv 同时把 uv 和对应 Python 放进 PATH。
      # 该 action 没有浮动 major tag（v10 不存在，只有 v10.x.y），因此固定到具体版本。
      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      # 后端自带 uv.lock；--frozen 保证解析结果与本地一致。
      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Print tool versions
        run: |
          uv --version
          python --version

      # 后端 lint：ruff check + format check。
      - name: Lint (ruff check + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 后端类型检查：ty。
      - name: Typecheck (ty)
        run: uv run ty check app tests

      # 后端测试（SQLite，不依赖 Docker）。
      - name: Test (pytest)
        run: uv run pytest

      # 后端构建，产物在服务内 dist/。
      - name: Build (uv build)
        run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 版本跟随 clients/web/package.json 的 engines.node（>=24 <25）。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 项目用 corepack 的 packageManager 字段锁 pnpm 版本。
      - name: Enable pnpm (version from packageManager)
        run: corepack enable pnpm

      # 项目自带 pnpm workspace 与 lockfile；frozen-lockfile 保证 CI 用的是锁定的依赖。
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      # 前端 lint。
      - name: Lint
        run: pnpm lint

      # workspace 内各 app 有自己的 test 脚本时自动执行。
      - name: Test
        run: pnpm -r --if-present run test

      # 前端类型检查（vue-tsc）。
      - name: Typecheck
        run: pnpm -r --filter "./apps/*" --if-present run type-check

      # 前端构建，产物在 apps/hub/dist。
      - name: Build
        run: pnpm build
