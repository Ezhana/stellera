# STELLERA HUB 的 nginx 站点配置。
#
# 镜像自身即可托管 Vite 产物并把 /api 反代到 compose 网络中的 api 服务；
# 未知路径回退到 index.html，以支持 vue-router 的 history 模式。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 供 Docker Compose healthcheck 使用，不写访问日志。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端 API：保留 /api 前缀转发到 compose 服务名 api。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite 产物带内容哈希，可长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    # SPA 路由回退（/login、/console 等）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发布后立即拿到新入口。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
